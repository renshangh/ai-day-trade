name: Documentation (GitHub Pages)

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Only the upstream repository publishes this site. Two reasons a fork must not:
#
#   1. `docsrc/_extra/CNAME` contains `lumibot.lumiwealth.com`, and `conf.py`
#      copies `_extra/` into the build root via `html_extra_path`. Pages sets a
#      repository's custom domain from a CNAME found in the deployed artifact, so
#      running this on a fork attempts to claim a domain the fork does not own
#      and cannot verify -- against a site that is live from Lumiwealth/lumibot.
#   2. The build job commits `llms.txt` back to `dev`, which on a fork means CI
#      pushing commits into somebody's working branch.
#
# Skipped rather than failed: a job whose `if` is false reports as skipped, so a
# fork's checks go quiet instead of red.
#
# The repository is named literally in each job's `if` rather than held in an
# `env` var, because GitHub does not expose the `env` context to job-level `if`
# conditions -- a variable here would read as the source of truth while the
# expressions silently ignored it.
#
# `docsrc/_extra/CNAME` is deliberately left in place: gating the workflow keeps
# the fork byte-identical to upstream here, so merges from Lumiwealth do not
# conflict and do not silently reintroduce publishing.

jobs:
  build:
    if: github.repository == 'Lumiwealth/lumibot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
          pip install sphinx furo sphinx-llms-txt

      - name: Build docs and generate llms files
        run: |
          cd docsrc
          # Build HTML + text output, generate compiled llms-full.txt
          make llms

      - name: Commit llms.txt files
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.txt llms-full.txt
          git diff --staged --quiet || git commit -m "docs: update llms.txt files (compiled) [skip ci]"
          git push || echo "Nothing to push"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docsrc/_build/html

  deploy:
    if: >-
      github.repository == 'Lumiwealth/lumibot'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

